name: Build APK

# Upload ONLY this file (in .github/workflows) and the project zip to the repo.
# Every push finds the newest zip, unpacks it, builds, signs and publishes the APK.
on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      zip:
        description: "Zip path in the repo (leave empty = newest zip)"
        required: false
        default: ""

concurrency:
  group: build-apk
  cancel-in-progress: true

permissions:
  contents: write

env:
  APP: _app

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: _app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find and unpack the project
        working-directory: .
        run: |
          set -euo pipefail
          rm -rf "$APP" _src && mkdir -p "$APP" _src
          ZIP="${{ inputs.zip }}"
          if [ -z "$ZIP" ]; then
            ZIP="$(git ls-files '*.zip' | while IFS= read -r z; do printf '%s %s\n' "$(git log -1 --format=%ct -- "$z")" "$z"; done | sort -k1,1nr -k2r | head -n1 | cut -d' ' -f2- || true)"
          fi
          if [ -n "$ZIP" ]; then
            echo "Using zip: $ZIP"
            unzip -q -o "$ZIP" -d _src
            CFG="$(find _src -name capacitor.config.json -not -path '*/node_modules/*' -not -path '*/__MACOSX/*' | head -n1)"
            if [ -z "$CFG" ]; then echo "::error::No capacitor.config.json inside $ZIP. Is this the right zip?"; exit 1; fi
            ROOT="$(dirname "$CFG")"
            cp -a "$ROOT/." "$APP/"
          elif [ -f capacitor.config.json ]; then
            echo "No zip found, building from the files in the repo"
            tar --exclude=./.git --exclude="./$APP" --exclude=./_src -cf - . | tar -xf - -C "$APP"
            ZIP="repo files"
          else
            echo "::error::No zip and no project files found. Upload the project zip to the repo."
            exit 1
          fi
          if [ ! -d "$APP/www" ]; then echo "::error::The project has no www folder."; exit 1; fi
          echo "ZIP_USED=$ZIP" >> "$GITHUB_ENV"
          echo "Project files:"; ls -1 "$APP"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache npm and Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: build-${{ runner.os }}-${{ hashFiles('_app/package.json') }}
          restore-keys: build-${{ runner.os }}-

      - name: Logic tests
        run: |
          if [ -f tests/core.test.js ]; then node tests/core.test.js; else echo "No tests in this project"; fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund --loglevel=error

      - name: Create Android project
        run: |
          if [ ! -d android ]; then npx cap add android; else echo "android folder already present"; fi

      - name: Icons and splash screens
        run: |
          if [ -d assets ]; then
            npx capacitor-assets generate --android --iconBackgroundColor '#0a2a2e' --iconBackgroundColorDark '#0a2a2e' --splashBackgroundColor '#edf3f1' --splashBackgroundColorDark '#0b1412'
          else
            echo "No assets folder, keeping default icon"
          fi

      - name: Patch Android project
        run: |
          if [ -f scripts/patch-android.sh ]; then bash scripts/patch-android.sh; else echo "No patch script"; fi

      - name: Sync web files
        run: npx cap sync android

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --console=plain 2>&1 | tee ../gradle.log

      - name: Sign APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS_SECRET: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -n "${KS_B64:-}" ]; then
            echo "$KS_B64" | base64 -d > ci.keystore
            KS=ci.keystore; PASS="${KS_PASS_SECRET:-}"; ALIAS="${KS_ALIAS_SECRET:-chulha}"; SRC="repository secrets"
          elif [ -f release.keystore ]; then
            KS=release.keystore; PASS=chulha-duty-2026; ALIAS=chulha; SRC="release.keystore from the project"
          else
            echo "::warning::No keystore found. A temporary key is used, so this APK will NOT install over an older build."
            keytool -genkeypair -keystore ci.keystore -alias temp -keyalg RSA -keysize 2048 -validity 10000 -storepass temp1234 -keypass temp1234 -dname "CN=Chulha Duty temporary"
            KS=ci.keystore; PASS=temp1234; ALIAS=temp; SRC="a temporary key (cannot update older installs)"
          fi
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)"
          UNSIGNED="$(ls android/app/build/outputs/apk/release/*.apk | head -n1)"
          OUT="out/ChulhaDuty-build${GITHUB_RUN_NUMBER}.apk"
          mkdir -p out
          "$BT/zipalign" -f -p 4 "$UNSIGNED" out/aligned.apk
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$ALIAS" --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --out "$OUT" out/aligned.apk
          "$BT/apksigner" verify "$OUT"
          rm -f out/aligned.apk out/*.idsig
          echo "APK_PATH=_app/$OUT" >> "$GITHUB_ENV"
          echo "KEY_SOURCE=$SRC" >> "$GITHUB_ENV"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: ChulhaDuty-APK
          path: ${{ env.APK_PATH }}
          retention-days: 14
          if-no-files-found: error

      - name: Publish release (direct APK download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Chulha Duty build ${{ github.run_number }}
          body: |
            Install the APK below over the old one. Do not uninstall the app: uninstalling deletes its data.
            Source: ${{ env.ZIP_USED }}
          files: ${{ env.APK_PATH }}
          make_latest: true

      - name: Keep only the 5 newest releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[5:][].tagName' \
            | xargs -r -I{} gh release delete {} -R "$GITHUB_REPOSITORY" --cleanup-tag --yes

      - name: Summary
        if: success()
        run: |
          APK="$GITHUB_WORKSPACE/$APK_PATH"
          {
            echo "## APK ready"
            echo "- File: \`$(basename "$APK")\` ($(du -h "$APK" | cut -f1))"
            echo "- Built from: \`$ZIP_USED\`"
            echo "- Signed with: $KEY_SOURCE"
            echo "- Download: https://github.com/$GITHUB_REPOSITORY/releases/tag/build-$GITHUB_RUN_NUMBER"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Error text to copy
        if: failure()
        run: |
          {
            echo "## Build failed"
            echo "Copy the text below and send it to Claude:"
            echo '```'
            if [ -f gradle.log ]; then tail -n 60 gradle.log; else echo "Failed before the Gradle step. Open the red step above and copy its last lines."; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
